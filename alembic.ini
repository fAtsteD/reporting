[alembic]
# Migration scripts location (used by the alembic CLI; db_connection.reconnect()
# overrides this with the package path when running migrations in-app).
script_location = src/reporting/database/migrations

# Make the project root importable so env.py can import reporting modules.
prepend_sys_path = .

# Migration filename template: date + time prefix then slug, for chronological
# ordering in the file tree. The revision hash stays inside the file.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
